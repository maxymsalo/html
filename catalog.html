<section id="catalog" class="catalog">
  <span class="catalog__label">// CATALOG</span>

  <h2 class="catalog__title">OUR PRODUCTS</h2>

  <p class="catalog__subtitle">
    Explore our curated timepieces, from classic essentials to bold statement pieces.
  </p>

  <!-- Tabs (UI only, logic can be added later) -->
  <div class="catalog__tabs">
    <div class="catalog__tab catalog__tab--active">Mechanical</div>
    <div class="catalog__tab">Quartz</div>
    <div class="catalog__tab">Automatic</div>
  </div>

  <!-- Toolbar -->
  <div class="catalog-toolbar">

    <input
      type="search"
      class="catalog-toolbar__search"
      placeholder="Search by name..."
      aria-label="Search products"
    />

    <select class="catalog-toolbar__sort" aria-label="Sort products">
      <option value="">Sort by</option>
      <option value="price-asc">Price: Low → High</option>
      <option value="price-desc">Price: High → Low</option>
      <option value="name">Name</option>
    </select>

    <button class="catalog-toolbar__add" type="button">
      Add New Product
    </button>

    <div class="catalog-toolbar__total">
      Total price:
      <span class="catalog-toolbar__total-value">$0</span>
    </div>

  </div>

  <!-- Catalog Grid (JS renders products here) -->
  <div class="catalog__grid"></div>

</section>

<!-- Add / Edit Product Modal -->
<div class="modal" id="productModal" hidden>
  <div class="modal__overlay"></div>

  <div class="modal__content">
    <button class="modal__close" type="button">&times;</button>

    <h3 class="modal__title">Add / Edit Product</h3>

    <form class="modal__form">
      <input
        type="text"
        name="name"
        placeholder="Product name"
        required
      />

      <input
        type="number"
        name="price"
        placeholder="Price"
        step="0.01"
        required
      />

      <input
        type="url"
        name="image"
        placeholder="Image URL"
        required
      />

      <button type="submit" class="modal__save">
        Save
      </button>
    </form>
  </div>
</div>

<!-- Mini Cart Popup -->
<div class="cart-popup" hidden>
  <div class="cart-popup__list"></div>
  <div class="cart-popup__total">Total: $0 USD</div>
</div>

<!-- Toast Notification -->
<div class="toast" id="toast" hidden></div>
